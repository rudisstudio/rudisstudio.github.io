<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <meta name="theme-color" content="#F4F8FC">
    <title>Sudoku Fest</title>
    <link rel="icon" type="image/png" href="TemplateData/favicon.png">
    <link rel="apple-touch-icon" href="TemplateData/apple-touch-icon.png">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");

      // Portrait 9:16: the canvas fills the window height and is 9/16 of it wide, centred. A window narrower than
      // 9:16 (a phone in portrait) is filled completely; the game's layout takes the extra height.
      function fitCanvas() {
        var w = window.innerWidth;
        var h = window.innerHeight;
        var cw = Math.min(w, Math.round(h * 9 / 16));
        var ch = h;
        canvas.style.width = cw + "px";
        canvas.style.height = ch + "px";
        canvas.style.left = Math.round((w - cw) / 2) + "px";
        canvas.style.top = "0px";
      }
      fitCanvas();
      window.addEventListener("resize", fitCanvas);
      window.addEventListener("orientationchange", fitCanvas);

      // Unity's warning banner is never shown; its messages only go to the console.
      function unityShowBanner(msg, type) {
        if (type == 'error') console.error(msg);
        else console.warn(msg);
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Web.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Web.data.unityweb",
        frameworkUrl: buildUrl + "/Web.framework.js.unityweb",
        codeUrl: buildUrl + "/Web.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Rudis Studio",
        productName: "Sudoku Fest",
        productVersion: "1",
        showBanner: unityShowBanner,
      };

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        })
          .then((unityInstance) => {
            loadingBar.style.display = "none";
          })
          .catch((message) => {
            alert(message);
          });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
